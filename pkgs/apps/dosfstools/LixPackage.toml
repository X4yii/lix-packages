[package]
name = "dosfstools"
version = "4.2.0"
authors = ["LixOS Storage Team", "Roman Hodek"]
license = "GPL-3.0-or-later"
type = "app"
description = "Herramientas de creacion y verificacion de sistemas de archivos FAT16/FAT32 para LixOS"

[dependencies]
lix-c = ">=0.1.0"
lix-core = ">=0.1.0"

[build]
compiler = "cc"
targets = ["x86_64-lixos", "x86_64-unknown-none"]
outputs = ["bin/mkfs.vfat"]
