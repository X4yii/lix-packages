[package]
name = "e2fsprogs"
version = "1.47.0"
authors = ["LixOS Storage Team", "Theodore Ts'o"]
license = "GPL-2.0"
type = "app"
description = "Utilidades estandar de creacion y verificacion de sistemas de archivos Ext2/Ext3/Ext4 para LixOS"

[dependencies]
lix-c = ">=0.1.0"
lix-core = ">=0.1.0"

[build]
compiler = "cc"
targets = ["x86_64-lixos", "x86_64-unknown-none"]
outputs = ["bin/mkfs.ext4", "bin/e2fsck"]
