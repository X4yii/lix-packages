[package]
name = "gcc"
version = "13.5.0"
authors = ["LixOS Toolchain Team", "Free Software Foundation"]
license = "GPL-3.0"
type = "app"
description = "GNU Compiler Collection y linker driver precompilado para LixOS estandar"

[dependencies]
lix-c = ">=0.1.0"
lix-core = ">=0.1.0"

[build]
compiler = "cc"
targets = ["x86_64-lixos", "x86_64-unknown-none"]
outputs = ["bin/gcc", "bin/cc"]
