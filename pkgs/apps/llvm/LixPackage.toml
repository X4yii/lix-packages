[package]
name = "llvm"
version = "19.1.1"
authors = ["LixOS Toolchain Team", "LLVM Project Developers"]
license = "Apache-2.0 WITH LLVM-exception"
type = "app"
description = "Coleccion LLVM, Clang y enlazador LLD precompilados para LixOS"

[dependencies]
lix-c = ">=0.1.0"
lix-core = ">=0.1.0"

[build]
compiler = "cc"
targets = ["x86_64-lixos", "x86_64-unknown-none"]
outputs = ["bin/clang", "bin/ld.lld"]
