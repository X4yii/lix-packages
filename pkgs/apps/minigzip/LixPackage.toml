[package]
name = "minigzip"
version = "1.3.1"
authors = ["LixOS Team", "Jean-loup Gailly", "Mark Adler"]
license = "Zlib"
type = "app"
description = "Herramienta estandar de compresion y descompresion Gzip portada de Linux para LixOS"

[dependencies]
lix-c = ">=0.1.0"
zlib = ">=1.0.0"

[build]
compiler = "cc"
targets = ["x86_64-unknown-lixos", "x86_64-unknown-none"]
outputs = ["bin/minigzip"]
