[package]
name = "parted"
version = "3.6.0"
authors = ["LixOS Storage Team", "Free Software Foundation"]
license = "GPL-3.0-or-later"
type = "app"
description = "Herramienta de manipulacion y creacion de tablas de particiones MBR y GPT para LixOS"

[dependencies]
lix-c = ">=0.1.0"
lix-core = ">=0.1.0"

[build]
compiler = "cc"
targets = ["x86_64-lixos", "x86_64-unknown-none"]
outputs = ["bin/parted"]
